<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Risk Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        {% if current_user.is_authenticated %}
            <div class="user-profile">
                <div class="avatar">{{ current_user.username[0]|upper }}</div>
                <span class="greeting">Hello, <strong>{{ current_user.username }}</strong></span>
            </div>
            
            <a href="{{ url_for('home') }}" class="btn-outline">Scanner</a>
            <a href="{{ url_for('history') }}" class="btn-outline">History</a>
            <a href="{{ url_for('logout') }}" class="btn-outline">Logout</a>
        {% else %}
            <a href="{{ url_for('login') }}" class="btn-outline">Login</a>
            <a href="{{ url_for('signup') }}" class="btn-outline">Create Account</a>
        {% endif %}
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
